server:
  host: "0.0.0.0"
  port: 8002

database:
  host: "a-postgresql.wezhike.ca"
  port: 5432
  database: "fap"
  user: "fap"
  password: "" # Loaded via environment variable DB_PASSWORD

logging:
  level: "INFO"
  file: "data_storage/logs/ai_service.log"
  console: true
  max_bytes: 10485760
  backup_count: 5

storage:
  data_storage_dir: "./data_storage"

models:
  xgboost_model_path: "src/ai_service/models/ai1_model.json"
  cnn_model_path: "src/ai_service/models/forest_fire_ai2_weights.h5"

thresholds:
  ai1_risk_threshold: 0.6
  ai2_alert_threshold: 0.8
